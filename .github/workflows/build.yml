name: build

# 什么时候跑：
#   - 推到 master：出一份可下载的构建产物（不建 Release）
#   - 推 v* 标签：额外创建一个 Release，包挂在 Release 里
#   - 手动点：Actions 页面点 Run workflow
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 媒体控制小工具要用 .NET 8 的 WinRT 投影编译
      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 类型检查不阻断打包：它是开发期卫生问题，不该让用户拿不到包
      - name: 类型检查（不阻断）
        continue-on-error: true
        run: pnpm typecheck

      # 用 pwsh 跑，把输出同时写进文件；失败时把末尾贴到构建摘要里。
      # GitHub 的 Actions 日志要登录才能看，摘要页不用——出问题能直接从外部读到原因。
      - name: 打包（编译 smtc.exe + electron-builder）
        id: dist
        shell: pwsh
        env:
          # 没有代码签名证书，明确关掉自动查找，避免打包卡在签名步骤
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 只留错误级 debug，全量 DEBUG 会让日志变成几千行，摘要里全是噪音
          DEBUG: 'electron-builder*@error'
        run: |
          pnpm dist 2>&1 | Tee-Object -FilePath dist.log
          if ($LASTEXITCODE -ne 0) {
            "## 打包失败，最后 150 行" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content dist.log -Tail 150 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

      - name: 打免安装压缩包（从 win-unpacked 打，跟本地一致）
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (Test-Path release\win-unpacked) {
            Compress-Archive -Path release\win-unpacked\* -DestinationPath "release\番茄钟-$v-免安装.zip" -Force
            Write-Host "已生成 release\番茄钟-$v-免安装.zip"
          } else {
            Write-Host "没有 win-unpacked，跳过压缩包"
          }

      - name: 列出产物
        run: Get-ChildItem release -Recurse -File | Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # 不上传 Artifacts：三个包共 392 MB，免费账户 Actions 存储只有 500 MB，
      # 两次构建就把额度撑满，之后上传会失败——而上传失败会让整个 job 失败，
      # 连后面的 Release 都建不出来。包一律走 Release，Release 附件不占这份额度。
      #
      # master 推送 → 更新一个滚动的「最新构建」预发布版，随时能下到最新的包
      - name: 发布最新构建（master）
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 最新构建（master）
          prerelease: true
          body: |
            由 master 每次推送自动覆盖更新，**不是正式版本**，随时可能被下一个构建替换。
            要稳定版本请到正式 Release 里下带版本号的那个。
          files: |
            release/*.exe
            release/*.zip
          fail_on_unmatched_files: true

      # 注意：自己写 if: 会顶掉 GitHub 默认的 success() 判断——
      # 不加 success() 的话，前面步骤全挂了这一步照样跑，
      # 于是会建出一个只有源码、没有安装包的 Release。已经踩过一次。
      - name: 建 Release（只在打标签且前面全部成功时）
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
          # 附件对不上就失败，别留一个空 Release 骗人
          fail_on_unmatched_files: true
