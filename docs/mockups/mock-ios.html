<!doctype html>
<!--
  v0.5 第三轮 · 风格三 · 系统感（iOS Native）

  一句话自我描述：这是苹果自带的 app。

  视觉语言与纸感 / 霓虹完全不同：系统红 #FF3B30、卡片 #1C1C1E（深）/ #FFFFFF（浅）、
  88px 字重 600 的紧凑数字、大圆角（卡片 22 / 按钮 26）、
  模板选择用分段控件（灰槽 + 滑块）、柔和阴影，不用任何发光。

  调色板写在下面的 :root 里，将来实现时整块搬进 tokens.css。
  用法：?theme=dark|light & ?size=small
-->
<html lang="zh-CN" data-phase="focus" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>v0.5 系统感</title>
    <link rel="stylesheet" href="../../src/renderer/styles/tokens.css" />
    <style>
      :root {
        --i-bg: #000000;
        --i-card: #1c1c1e;
        --i-elev: #2c2c2e;
        --i-accent: #ff3b30;
        --i-track: rgba(120, 120, 128, 0.2);
        --i-ink: #ffffff;
        --i-ink-2: rgba(235, 235, 245, 0.6);
        --i-seg: rgba(118, 118, 128, 0.16);
        --i-thumb: #636366;
        --i-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }
      html[data-theme='light'] {
        --i-bg: #f2f2f7;
        --i-card: #ffffff;
        --i-elev: #ffffff;
        --i-ink: #000000;
        --i-ink-2: rgba(60, 60, 67, 0.6);
        --i-seg: rgba(118, 118, 128, 0.16);
        --i-thumb: #ffffff;
        --i-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--i-bg);
        font-family: 'Segoe UI Variable', 'SF Pro Display', system-ui, sans-serif;
        color: var(--i-ink);
        display: grid;
        place-items: center;
      }

      .frame {
        --ring: 290px;
        width: 480px;
        height: 620px;
        display: flex;
        flex-direction: column;
        background: var(--i-bg);
        overflow: hidden;
      }
      .frame[data-size='small'] {
        --ring: 240px;
        width: 420px;
        height: 560px;
      }

      /* ---- 顶栏 ---- */
      .top {
        flex: none;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
      }
      .stage {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .more {
        width: 30px;
        height: 30px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: var(--i-elev);
        color: var(--i-ink-2);
      }

      /* ---- 卡片：里面装着环和时间 ---- */
      .card {
        flex: none;
        margin: 0 16px;
        padding: 10px 8px 8px;
        border-radius: 22px;
        background: var(--i-card);
        box-shadow: var(--i-shadow);
      }
      .ring-area {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ring {
        position: relative;
        height: var(--ring);
        width: var(--ring);
      }
      .ring svg {
        width: 100%;
        height: 100%;
        display: block;
        transform: rotate(-90deg);
      }
      .ring__track {
        fill: none;
        stroke: var(--i-track);
        stroke-width: 8;
      }
      .ring__arc {
        fill: none;
        stroke: var(--i-accent);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 942;
        stroke-dashoffset: 236;
      }
      .ring__center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .time {
        font-family: 'Segoe UI Variable', 'SF Pro Display', system-ui, sans-serif;
        font-size: 88px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--i-ink);
      }
      .task {
        margin-top: 8px;
        font-size: 15px;
        font-weight: 500;
        color: var(--i-ink-2);
      }

      /* ---- 按钮：大圆角药丸 ---- */
      .controls {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 12px 0 2px;
      }
      .btn {
        width: 56px;
        height: 56px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: var(--i-elev);
        color: var(--i-ink);
      }
      .btn--main {
        width: 132px;
        height: 56px;
        border-radius: 28px;
        background: var(--i-accent);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      /* ---- 模板：分段控件 ---- */
      .seg {
        flex: none;
        margin: 12px 16px 0;
        padding: 2px;
        border-radius: 12px;
        background: var(--i-seg);
        display: flex;
        position: relative;
      }
      .seg__thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        bottom: 2px;
        width: calc((100% - 4px) / 3);
        border-radius: 10px;
        background: var(--i-thumb);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      }
      .seg__item {
        position: relative;
        z-index: 1;
        flex: 1;
        height: 34px;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: var(--i-ink-2);
      }
      .seg__item--on {
        color: var(--i-ink);
        font-weight: 600;
      }

      /* ---- 主题：小药丸 ---- */
      .row {
        flex: none;
        margin: 10px 16px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row__label {
        flex: none;
        width: 32px;
        font-size: 13px;
        color: var(--i-ink-2);
      }
      .chip {
        height: 32px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        border-radius: 16px;
        background: var(--i-elev);
        font-size: 14px;
        color: var(--i-ink-2);
      }
      .chip--on {
        background: var(--i-accent);
        color: #fff;
        font-weight: 600;
      }

      /* ---- 状态 ---- */
      .status {
        flex: none;
        text-align: center;
        font-size: 13px;
        color: var(--i-ink-2);
        padding: 12px 0 6px;
      }

      /* ---- 标签栏 ---- */
      .nav {
        flex: none;
        height: 54px;
        margin: auto 12px 12px;
        border-radius: 22px;
        background: var(--i-card);
        box-shadow: var(--i-shadow);
        display: flex;
        align-items: center;
        justify-content: space-around;
        font-size: 11px;
        color: var(--i-ink-2);
      }
      .nav__item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .nav__item--on {
        color: var(--i-accent);
      }
    </style>
  </head>
  <body>
    <section class="frame" data-for="main">
      <header class="top">
        <span class="stage">专注</span>
        <span class="more">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="currentColor">
            <circle cx="4" cy="9" r="1.4" />
            <circle cx="9" cy="9" r="1.4" />
            <circle cx="14" cy="9" r="1.4" />
          </svg>
        </span>
      </header>

      <div class="card">
        <div class="ring-area">
          <div class="ring">
            <svg viewBox="0 0 320 320">
              <circle class="ring__track" cx="160" cy="160" r="150" />
              <circle class="ring__arc" cx="160" cy="160" r="150" />
            </svg>
            <div class="ring__center">
              <span class="time">25:00</span>
              <span class="task">写方案</span>
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <span class="btn">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.2 4.6a6.4 6.4 0 1 1-1 5.6" />
            <path d="M3 3.4v3.4h3.4" />
          </svg>
        </span>
        <span class="btn btn--main">开始</span>
        <span class="btn">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none">
            <path d="M4.4 4.4 12 9l-7.6 4.6Z" fill="currentColor" />
            <rect x="12.6" y="4.4" width="1.8" height="9.2" rx="0.8" fill="currentColor" />
          </svg>
        </span>
      </div>

      <div class="seg">
        <span class="seg__thumb"></span>
        <span class="seg__item seg__item--on">经典</span>
        <span class="seg__item">深度</span>
        <span class="seg__item">冲刺</span>
      </div>

      <div class="row">
        <span class="row__label">主题</span>
        <span class="chip chip--on">写代码</span>
        <span class="chip">读论文</span>
        <span class="chip">未分类</span>
      </div>

      <div class="status">今天 2 个 · 50 分钟</div>

      <nav class="nav">
        <span class="nav__item nav__item--on">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="6.6" />
            <path d="M10 6.6V10l2.4 1.6" />
          </svg>
          计时
        </span>
        <span class="nav__item">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.6 15.4V10M8 15.4V5.4M12.4 15.4v-7M16.8 15.4V7.6" />
          </svg>
          统计
        </span>
        <span class="nav__item">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="2.8" />
            <path d="M10 2.8v2M10 15.2v2M17.2 10h-2M4.8 10h-2M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4M15.1 15.1l-1.4-1.4M6.3 6.3 4.9 4.9" />
          </svg>
          设置
        </span>
      </nav>
    </section>

    <script>
      const q = new URLSearchParams(location.search)
      const theme = q.get('theme') || 'dark'
      const size = q.get('size') || 'normal'
      document.documentElement.dataset.theme = theme
      document.querySelectorAll('[data-for]').forEach((el) => {
        if (size === 'small') el.dataset.size = 'small'
      })
    </script>
  </body>
</html>
