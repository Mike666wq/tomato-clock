<!doctype html>
<!--
  v0.5 第三轮 · 风格二 · 玻璃霓虹（Neon Glass）

  一句话自我描述：这是一块发光装置。

  视觉语言与纸感 / 系统感完全不同：近黑底 + 径向渐变、荧光橙 #FF5A3C、
  进度弧双层发光、128px 字重 100 的数字带光晕、面板是半透明描边卡片、
  主按钮是带外发光的圆形实心键、次要按钮纯图标无描边。

  调色板写在下面的 :root 里，将来实现时整块搬进 tokens.css。
-->
<html lang="zh-CN" data-phase="focus">
  <head>
    <meta charset="utf-8" />
    <title>v0.5 霓虹</title>
    <link rel="stylesheet" href="../../src/renderer/styles/tokens.css" />
    <style>
      :root {
        --n-bg: #08090b;
        --n-glow: #ff5a3c;
        --n-ink: #f2f4f7;
        --n-ink-2: rgba(242, 244, 247, 0.55);
        --n-line: rgba(255, 255, 255, 0.1);
        --n-panel: rgba(255, 255, 255, 0.035);
        --n-track: rgba(255, 255, 255, 0.06);
        --n-glow-shadow: 0 0 24px rgba(255, 90, 60, 0.55);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        font-family: var(--font-ui);
        color: var(--n-ink);
        display: grid;
        place-items: center;
      }

      .frame {
        --ring: 360px;
        width: 480px;
        height: 620px;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at 50% 28%, #1a0e14, #08090b 70%), var(--n-bg);
        overflow: hidden;
        box-shadow: 0 0 90px rgba(255, 90, 60, 0.12);
      }
      .frame[data-size='small'] {
        --ring: 330px;
        width: 420px;
        height: 560px;
      }

      /* ---- 顶栏 ---- */
      .top {
        flex: none;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px;
      }
      .stage {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: var(--n-ink-2);
      }
      .stage::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--n-glow);
        box-shadow: 0 0 10px var(--n-glow), 0 0 22px var(--n-glow);
      }
      .more {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--n-panel);
        border: 1px solid var(--n-line);
        color: var(--n-ink-2);
      }

      /* ---- 圆环：10px 弧 + 双层发光 ---- */
      .ring-area {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0 8px;
      }
      .ring {
        position: relative;
        height: min(100%, var(--ring));
        width: auto;
        aspect-ratio: 1;
        max-width: 100%;
      }
      .ring svg {
        width: 100%;
        height: 100%;
        display: block;
        transform: rotate(-90deg);
      }
      .ring__track {
        fill: none;
        stroke: var(--n-track);
        stroke-width: 10;
      }
      .ring__arc {
        fill: none;
        stroke: var(--n-glow);
        stroke-width: 10;
        stroke-linecap: round;
        stroke-dasharray: 942;
        stroke-dashoffset: 236;
        filter: drop-shadow(0 0 8px rgba(255, 90, 60, 0.6)) drop-shadow(0 0 24px rgba(255, 90, 60, 0.4));
      }
      .ring__center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .time {
        font-family: var(--font-num);
        font-size: 128px;
        font-weight: 100;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--n-ink);
        text-shadow: 0 0 48px rgba(255, 90, 60, 0.28);
      }
      .task {
        margin-top: 14px;
        font-size: 12px;
        letter-spacing: 0.24em;
        color: var(--n-ink-2);
      }

      /* ---- 按钮：主按钮带外发光，次要纯图标无描边 ---- */
      .controls {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 42px;
        padding: 8px 0;
      }
      .btn {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        color: var(--n-ink-2);
      }
      .btn--main {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--n-glow);
        color: #fff;
        box-shadow: var(--n-glow-shadow), inset 0 0 20px rgba(255, 255, 255, 0.18);
      }

      /* ---- 模板 / 主题：玻璃小片 ---- */
      .rows {
        flex: none;
        padding: 0 26px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row__label {
        flex: none;
        width: 30px;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--n-ink-2);
      }
      .chip {
        height: 26px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        border-radius: 15px;
        background: var(--n-panel);
        border: 1px solid var(--n-line);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--n-ink-2);
      }
      .chip--on {
        color: var(--n-ink);
        border-color: rgba(255, 90, 60, 0.55);
        background: rgba(255, 90, 60, 0.1);
        box-shadow: 0 0 16px rgba(255, 90, 60, 0.22);
      }

      /* ---- 状态行 ---- */
      .status {
        flex: none;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--n-ink-2);
        padding: 12px 0 10px;
      }

      /* ---- 导航：一块浮起来的玻璃条 ---- */
      .nav {
        flex: none;
        margin: 0 18px 14px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        border-radius: 18px;
        background: var(--n-panel);
        border: 1px solid var(--n-line);
        color: var(--n-ink-2);
        font-size: 11px;
        letter-spacing: 0.1em;
      }
      .nav__item--on {
        color: var(--n-glow);
        text-shadow: 0 0 14px rgba(255, 90, 60, 0.5);
      }
    </style>
  </head>
  <body>
    <section class="frame" data-for="main">
      <header class="top">
        <span class="stage">专注</span>
        <span class="more">
          <svg width="15" height="15" viewBox="0 0 18 18" fill="currentColor">
            <circle cx="4" cy="9" r="1.4" />
            <circle cx="9" cy="9" r="1.4" />
            <circle cx="14" cy="9" r="1.4" />
          </svg>
        </span>
      </header>

      <div class="ring-area">
        <div class="ring">
          <svg viewBox="0 0 320 320">
            <circle class="ring__track" cx="160" cy="160" r="150" />
            <circle class="ring__arc" cx="160" cy="160" r="150" />
          </svg>
          <div class="ring__center">
            <span class="time">25:00</span>
            <span class="task">写方案</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <span class="btn">
          <svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.2 4.6a6.4 6.4 0 1 1-1 5.6" />
            <path d="M3 3.4v3.4h3.4" />
          </svg>
        </span>
        <span class="btn btn--main">
          <svg width="30" height="30" viewBox="0 0 28 28" fill="none">
            <rect x="9.5" y="5.5" width="3.4" height="17" rx="1.4" fill="currentColor" />
            <rect x="16.1" y="5.5" width="3.4" height="17" rx="1.4" fill="currentColor" />
          </svg>
        </span>
        <span class="btn">
          <svg width="22" height="22" viewBox="0 0 18 18" fill="none">
            <path d="M4.4 4.4 12 9l-7.6 4.6Z" fill="currentColor" />
            <rect x="12.6" y="4.4" width="1.8" height="9.2" rx="0.8" fill="currentColor" />
          </svg>
        </span>
      </div>

      <div class="rows">
        <div class="row">
          <span class="row__label">模板</span>
          <span class="chip chip--on">经典</span>
          <span class="chip">深度</span>
          <span class="chip">冲刺</span>
        </div>
        <div class="row">
          <span class="row__label">主题</span>
          <span class="chip chip--on">写代码</span>
          <span class="chip">读论文</span>
          <span class="chip">未分类</span>
        </div>
      </div>

      <div class="status">今天 2 个 · 50 分钟</div>

      <nav class="nav">
        <span class="nav__item nav__item--on">计时</span>
        <span class="nav__item">统计</span>
        <span class="nav__item">设置</span>
      </nav>
    </section>

    <script>
      const q = new URLSearchParams(location.search)
      const size = q.get('size') || 'normal'
      document.querySelectorAll('[data-for]').forEach((el) => {
        if (size === 'small') el.dataset.size = 'small'
      })
    </script>
  </body>
</html>
